aid: graphistry
name: Graphistry
description: >-
  Graphistry is a GPU-accelerated visual graph analytics platform for exploring,
  analyzing, and sharing very large graphs and networks directly in the browser.
  Its open-source PyGraphistry Python client loads, shapes, embeds, and visualizes
  big graphs from Pandas, Spark, and RAPIDS with end-to-end GPU acceleration, and
  includes GFQL, a vectorized graph query language. Graphistry Hub is the hosted
  service exposing a JWT-authenticated REST API for uploading datasets and rendering
  interactive visualizations, complemented by JavaScript embedding libraries, a CLI
  for self-hosting, and integrations with Neo4j, Databricks, and RAPIDS. Added to
  the API Evangelist network from the Bloomberg Beta portfolio.
